name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: node 22 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Syntax check（包内所有 js/mjs）
        run: npm run check:syntax

      - name: Unit / integration tests（node --test，跨平台）
        run: node --test

      - name: Secret & private-data guard（零私有值）
        run: npm run check:secrets

      - name: Package manifest guard（npm pack 清单）
        run: npm run check:pack
