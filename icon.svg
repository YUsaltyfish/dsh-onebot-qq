<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="dsh-onebot-qq">
  <title>dsh-onebot-qq</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6cf6"/>
      <stop offset="1" stop-color="#6c3ef0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8efff"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <circle cx="196" cy="60" r="34" fill="#ffffff" opacity="0.10"/>
  <circle cx="52" cy="206" r="52" fill="#ffffff" opacity="0.08"/>

  <!-- 对话气泡 + 机器人头 -->
  <g>
    <rect x="50" y="62" width="156" height="120" rx="34" fill="url(#face)"/>
    <path d="M92 178 L82 208 Q80 218 91 213 L124 190 Z" fill="url(#face)"/>

    <!-- 天线 -->
    <rect x="124" y="34" width="8" height="30" rx="4" fill="#ffffff"/>
    <circle cx="128" cy="32" r="12" fill="#7df3ff" stroke="#ffffff" stroke-width="5"/>

    <!-- 眼睛 -->
    <rect x="82" y="100" width="28" height="34" rx="14" fill="#243a91"/>
    <rect x="146" y="100" width="28" height="34" rx="14" fill="#243a91"/>
    <circle cx="91" cy="112" r="6" fill="#7df3ff"/>
    <circle cx="155" cy="112" r="6" fill="#7df3ff"/>

    <!-- 嘴（微笑格栅） -->
    <path d="M104 152 Q128 168 152 152" fill="none" stroke="#243a91" stroke-width="8" stroke-linecap="round"/>
    <circle cx="82" cy="88" r="6" fill="#b9c9ff"/>
    <circle cx="174" cy="88" r="6" fill="#b9c9ff"/>

    <!-- 侧耳 -->
    <rect x="30" y="104" width="16" height="36" rx="8" fill="#ffffff" opacity="0.85"/>
    <rect x="210" y="104" width="16" height="36" rx="8" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
